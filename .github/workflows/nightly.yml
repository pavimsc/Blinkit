name: Nightly AI-Powered Discovery Engine

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC every night
  workflow_dispatch: {}   # allows manual "Run workflow" trigger for testing/demos

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch newest Play Store reviews
        run: python scraper/fetch_reviews.py

      - name: Extract per-review themes (Pass A)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python analysis/extract_themes.py

      - name: Synthesize insights (Pass B)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python analysis/synthesize_insights.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Nightly discovery engine run [skip ci]"
            git push
          fi
